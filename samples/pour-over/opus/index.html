<style>
/* colours are overwritten at boot from CFG.colors so the canvas and the DOM share one palette */
:root{
  color-scheme: dark;
  --bg:#06080B; --line:#1E262F; --ink:#E8ECEF; --dim:#7A848F; --acc:#FFB224; --alt:#3FE0D0;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --bar-y:92.87%; --page:#020203; --glass:rgba(6,8,11,.84);
}
html,body{height:100%;background:var(--page);color:var(--ink)}
[hidden]{display:none!important}
body{font-family:var(--sans);margin:0;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.stage{position:relative;min-height:0;background:var(--page);container-type:size;overflow:hidden;cursor:pointer}
.screen{position:absolute;left:50%;top:50%;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.start{position:absolute;left:4.5%;top:50%;transform:translateY(-50%);width:max-content;height:max-content;display:flex;align-items:center;gap:1cqw;
  padding:1cqw 1.6cqw 1cqw 1.15cqw;background:var(--glass);border:1px solid var(--acc);color:var(--ink);cursor:pointer;
  font-family:var(--sans);font-size:clamp(10px,1.3cqw,24px);font-weight:700;backdrop-filter:blur(6px)}
.start:hover{border-color:var(--alt)}
.start:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
.start .tri{width:0;height:0;border-left:1.4cqw solid var(--acc);border-top:.9cqw solid transparent;border-bottom:.9cqw solid transparent}
.start small{display:block;font-family:var(--sans);font-size:clamp(8px,.78cqw,14px);font-weight:500;color:var(--dim);margin-top:.25cqw}
/* hit area over the canvas HUD progress bar; left/width are set from BAR at boot */
.scrub{position:absolute;top:calc(var(--bar-y) - 2.4%);height:4.8%;cursor:pointer;touch-action:none}
.scrub:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
/* end-frame hotspot: an object drawn on the last frame becomes the link (position set from CFG.endCta) */
.endcta{position:absolute;display:block;cursor:pointer;color:var(--acc);text-decoration:none}
.endcta .rt{position:absolute;inset:0;animation:lock .857s cubic-bezier(.2,.7,.2,1) infinite}
.endcta .rt i{position:absolute;width:14%;height:14%;border:3px solid var(--acc)}
.endcta .rt i:nth-child(1){left:-4%;top:-4%;border-right:0;border-bottom:0}
.endcta .rt i:nth-child(2){right:-4%;top:-4%;border-left:0;border-bottom:0}
.endcta .rt i:nth-child(3){left:-4%;bottom:-4%;border-right:0;border-top:0}
.endcta .rt i:nth-child(4){right:-4%;bottom:-4%;border-left:0;border-top:0}
@keyframes lock{0%{transform:scale(1.14);opacity:.25}35%{transform:scale(1);opacity:1}100%{transform:scale(1.02);opacity:.7}}
.endcta .tag{position:absolute;left:104%;top:50%;transform:translateY(-50%);white-space:nowrap;padding:10px 14px;border:1px solid var(--acc);
  background:var(--glass);font-family:var(--sans);font-size:clamp(12px,1.35vw,20px);font-weight:900;color:var(--ink)}
.endcta .tag::before{content:"";position:absolute;right:100%;top:50%;width:clamp(12px,2.2vw,40px);height:1px;background:var(--acc)}
.endcta:hover .rt,.endcta:focus-visible .rt{animation:none;transform:scale(.97)}
.endcta:hover .rt i,.endcta:focus-visible .rt i{border-color:var(--alt)}
.endcta:hover,.endcta:focus-visible{outline:none}
/* dock under the film: CTA button + language link */
.dock{position:relative;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:6px 16px calc(10px + env(safe-area-inset-bottom, 0px));background:var(--page)}
.cta{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;min-width:0;box-sizing:border-box;padding:12px 16px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0))}
.cta .led{flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:led .857s steps(2) infinite}
@keyframes led{50%{opacity:.25}}
.cta .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.cta .lab b{font-family:var(--mono);font-size:14px;letter-spacing:.1em;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta .lab small{font-size:12px;color:var(--dim)}
.cta .go{margin-left:auto;flex:none;font-weight:900;font-size:16px;padding:9px 14px;background:var(--acc);color:var(--bg);white-space:nowrap}
.cta:hover .go,.cta:focus-visible .go{background:var(--alt)}
.cta:focus-visible{outline:2px solid var(--alt);outline-offset:3px}
.lang{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--dim);border:1px solid var(--line);padding:7px 11px;text-decoration:none}
.lang:hover,.lang:focus-visible{color:var(--acc);border-color:var(--acc);outline:none}
@media (max-width:1100px){ .lang{position:static;transform:none} }
@media (prefers-reduced-motion: reduce){ .endcta .rt,.cta .led{animation:none} }
@media (max-width:640px){ .endcta .tag{display:none} .cta .go{font-size:14px;padding:8px 10px} .cta .lab b{white-space:normal;letter-spacing:.04em} }
/* touch devices: rotate hint + full-screen button, finger-sized start button and progress bar */
.mob{display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;width:100%}
.rot{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--dim)}

.fsb:active,.fsb:focus-visible{color:var(--acc);border-color:var(--acc);outline:none}
@media (pointer:coarse){
  .mob{display:flex}
  .start{font-size:clamp(13px,1.3cqw,24px);gap:max(1cqw,8px);padding:max(1cqw,9px) max(1.6cqw,14px) max(1cqw,9px) max(1.15cqw,11px)}

@media (orientation:portrait){
  .app{grid-template-rows:auto auto;align-content:center;gap:12px}
  .stage{aspect-ratio:16/9;height:auto}
}
@media (orientation:landscape){ .rot{display:none} }
/* phone landscape: the dock moves to a narrow side column so the film gets the full height */
@media (orientation:landscape) and (max-height:540px){
  .app{box-sizing:border-box;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) auto;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  .dock{box-sizing:border-box;width:136px;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:center;gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)) 8px}
  .cta{flex-direction:column;align-items:stretch;gap:8px;padding:10px 8px}
  .cta .lab,.cta .led{display:none}
  .cta .go{margin-left:0;white-space:normal;text-align:center;font-size:13px;line-height:1.35;padding:8px 6px}
  .lang{text-align:center;padding:7px 6px}
  .fsb{width:100%}
}

<script>
(() => {

/* ================================================================ CONFIG — edit this block first */
// @@config

  colors: { bg: '#F4ECE0', panel: '#FFFBF4', line: '#E2D5C3', ink: '#2B1E16', dim: '#7A6756', grid: '#E9DDCC',

  stepOf: ['5단계 중 1', '5단계 중 2', '5단계 중 3', '5단계 중 4', '5단계 중 5'],
  oK: '핸드드립 가이드', oH: ['처음 내려보는', 'V60 핸드드립'], oS: '두 잔 분량 · 쉬운 5단계',

  fH: ['3분 안에 끝나요'], fS: ['2:30–3:00이면 딱 좋아요', '물이 거의 빠지면 드리퍼를 내려요'], zone: '2:30–3:00',

  cT: 'V60 · 두 잔',
  cR: [['원두', '22 g · 중간보다 조금 가늘게'], ['물', '400 g · 93 °C'], ['뜸', '50 g · 30초'], ['추출 시간', '3분 안에']]

// @@/copy
const LANGS = Object.keys(I18N);
const qLang = new URLSearchParams(location.search).get('lang');
const LANG = LANGS.includes(qLang) ? qLang : LANGS.includes(document.documentElement.lang) ? document.documentElement.lang : LANGS[0];
const TXT = I18N[LANG];

/* ================================================================ DRAW HELPERS */
function font(f, w, z, ls){ ctx.font = `${w} ${z}px ${f}`; if ('letterSpacing' in ctx) ctx.letterSpacing = (ls || 0) + 'px'; }
function T(s, x, y, o = {}){
  const { f = FK, w = 900, c = C.ink, al = 'left', bl = 'alphabetic', ls = 0, a = 1, fit = 0 } = o;
  let { z = 64 } = o;
  if (!s || a <= 0) return;
  if (fit > 0){ const tw = mw(s, f, w, z, ls); if (tw > fit) z = z * fit / tw; }   // shrink long (e.g. translated) lines to their box
  ctx.save(); ctx.globalAlpha *= a; font(f, w, z, ls); ctx.fillStyle = c; ctx.textAlign = al; ctx.textBaseline = bl; ctx.fillText(s, x, y); ctx.restore();
}
function mw(s, f, w, z, ls = 0){ ctx.save(); font(f, w, z, ls); const m = ctx.measureText(s).width; ctx.restore(); return m; }
const typeOn = (s, p) => s.slice(0, Math.round(s.length * clamp(p)));
// headline hit: overshoot scale + RGB split for the first frames
function slam(s, x, y, lt, t0, o = {}){
  const p = inv(t0, t0 + .2, lt); if (p <= 0) return;
  const sc = lerp(1.32, 1, eBack(p)), g = (1 - inv(t0, t0 + .16, lt)) * 16;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  if (g > .5 && (o.split ?? CFG.textSplit) !== false){ T(s, -g, 0, { ...o, c: C.alt, a: .75 }); T(s, g, 0, { ...o, c: C.bad, a: .75 }); }
  T(s, 0, 0, o); ctx.restore();
}
// calm entrance: fade in while rising dy px — the quiet counterpart of slam for soft/editorial styles
function rise(s, x, y, lt, t0, o = {}, dur = .5, dy = 28){
  const p = inv(t0, t0 + dur, lt); if (p <= 0) return;
  T(s, x, y + (1 - eO(p)) * dy, { ...o, a: (o.a ?? 1) * eO(p) });
}
function kicker(s, x, y, lt, t0 = 0, c = C.acc, al = 'left'){ T(typeOn(s, inv(t0, t0 + .32, lt)), x, y, { f: FM, w: 700, z: 22, c, ls: 4, al }); }
// closed-form damped spring 0 → 1, t in seconds since the move started (k stiffness, d damping). A pure function of
// time like everything else, so ?t= stills stay exact. Unlike eO/eIO/eBack it has mass: no fixed duration, it settles
// on its own (~0.35–0.7 s) and underdamped presets overshoot a hair. Spread a preset in: spring(lt - t0, ...SPRING.heavy)
const SPRING = {
  snappy: [320, 28],    // buttons, toggles, chips, leading edges — tiny overshoot, settles ~0.35 s
  default: [170, 26],   // cards, panels, bars, camera — no visible overshoot, ~0.5 s (same as spring() with no k, d)
  heavy: [90, 19],      // big type, logos, large objects — no overshoot, ~0.7 s
  playful: [220, 16],   // stickers, mascots, badges — visible bounce (~13 %)
};
function spring(t, k = 170, d = 26){
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1){ const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  if (z > 1.001){ const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s; return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1); }   // overdamped: slower, still no overshoot
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);   // critical

// a value that changes target several times: keys = [[time, value], ...] sorted by time, at least one. Each change adds
// its own spring from its own start, so retargeting mid-move stays continuous and any t is still computed directly
function track(t, keys, k = 170, d = 26){
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * spring(t - keys[i][0], k, d);

    for (let k = 0; k <= 12; k++){ const f = k / 12, yy = y - f * h - ph * 30; ctx.lineTo(x + s.dx + Math.sin(f * 5 + lt * 2.4 + s.ph) * 12, yy); } ctx.stroke(); });
  ctx.restore();
}
// water temperature pill: a fixed spot left of the stream, drawn above the bar (and outside the camera), while water is poured
function tempPill(p){
  if (p <= 0) return;
  ctx.save(); ctx.translate(1256, 302); ctx.scale(lerp(.6, 1, p), lerp(.6, 1, p)); ctx.globalAlpha *= clamp(p * 2);
  ctx.fillStyle = C.panel; ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(-80, -34, 160, 68, 34); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.alt; ctx.beginPath(); ctx.moveTo(-52, -14); ctx.quadraticCurveTo(-40, 2, -40, 8); ctx.arc(-52, 8, 12, 0, Math.PI); ctx.quadraticCurveTo(-64, 2, -52, -14); ctx.fill();
  T(TXT.temp, 16, 15, { f: FH, w: WT(900), z: 40, c: C.acc, al: 'center' }); ctx.restore();
}

// camera: scale the brew bar about a point on the counter (copy column untouched)
const ZF = CX - 200;   // bloom close-up focus (on the counter, left of the dripper, so the bar grows up and right)
function cam(z, fx = CX){ ctx.translate(fx, BENCH); ctx.scale(z, z); ctx.translate(-fx, -BENCH); }
// a dark pill on the counter under the scale (tare note, sped-up timer note)
function benchTag(s, a, lift = 0){
  if (a <= 0) return; const w = mw(s, FH, WT(900), 44, KO ? 0 : 2) + 64, x = CX - w / 2, y = 950 + lift;
  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(x, y - 50, w, 66, 33); ctx.fill();
  ctx.beginPath(); ctx.moveTo(CX - 13, y - 50); ctx.lineTo(CX, y - 64); ctx.lineTo(CX + 13, y - 50); ctx.fill();
  T(s, CX, y, { f: FH, w: WT(900), z: 44, c: C.bg, al: 'center', ls: KO ? 0 : 2 }); ctx.restore();
}

/* ---------------------------------------------------------------- copy column */
// objects in the copy column (ring, inset) leave in the last .25 s of a scene. Copy itself stays to the cut:
// each scene's copy() is redrawn frozen by the cut's wipe (style.js), so the wipe clears old copy and uncovers new copy in one pass
const exitA = (lt, d) => d ? 1 - eIO(inv(d - .26, d - .03, lt)) : 1;
function stepBadge(n, lt, d){
  const p = spring(lt - .08, ...SPRING.snappy) * exitA(lt, d); if (p <= 0) return;
  ctx.save(); ctx.translate(156, 290); ctx.scale(p, p); dot(0, 0, 46, C.ink); T(String(n), 0, 20, { f: FK, w: 900, z: 56, c: C.bg, al: 'center' }); ctx.restore();
}
function copyBlock(lt, lines, sub, o = {}){
  const { y = 450, z = 104, gap = 112, t0 = .1, fit = 780, d = 0 } = o, a = exitA(lt, d), dy = (1 - a) * -14;
  lines.forEach((s, i) => rise(s, 110, y + dy + i * gap, lt, t0 + i * .12, { f: FH, w: WT(900), z, fit, c: C.ink, a }, .5, 26));
  if (sub) [].concat(sub).forEach((s, i) => rise(s, 110, dy + (o.sy ?? (y + (lines.length - 1) * gap + 100)) + i * 70, lt, t0 + .42 + i * .1, { f: FH, w: WT(800), z: 58, fit, c: C.dim, a }, .5, 16));
}

/* ---------------------------------------------------------------- scenes */
S.open = {
  draw(lt, d, t){
    const lcd = inv(1.5 * B, 1.5 * B + .15, lt);
    scaleBody(lcd, 0, 0, { flash: (1 - inv(1.5 * B, 2.4 * B, lt)) * (lcd > 0 ? .8 : 0) });
    server(0, COF);
    dripper({ dy: -150 * (1 - spring(lt, ...SPRING.heavy)), a: inv(0, .2, lt) });
    kettle(KREST); steam(KREST.x + 4, KREST.y - 16, lt, inv(.4, 1.2, lt));
    S.open.copy(lt);
  },
  copy(lt){
    const ea = 1;
    T(TXT.oK, 110, 140, { f: FH, w: WT(800), z: 34, c: C.acc, ls: KO ? 0 : 4, a: inv(.1, .35, lt) });
    copyBlock(lt, TXT.oH, null, { y: 248, z: 124, gap: 120, t0: .15, fit: 880 });
    rise(TXT.oS, 110, 748, lt, 1.1, { f: FH, w: WT(800), z: 50, c: C.dim, fit: 780 }, .5, 16);
    // five numbered dots spring in one per half beat: the whole lesson at a glance
    for (let i = 0; i < 5; i++){ const p = spring(lt - (2.5 + i * .5) * B, ...SPRING.playful) * ea; if (p <= 0) continue;
      ctx.save(); ctx.translate(140 + i * 76, 826); ctx.scale(p, p); dot(0, 0, 28, i ? C.ink : C.acc); T(String(i + 1), 0, 11, { f: FK, w: 900, z: 32, c: C.bg, al: 'center' }); ctx.restore();
      if (i < 4){ const q = inv((2.75 + i * .5) * B, (3 + i * .5) * B, lt) * ea; if (q > 0){ ctx.fillStyle = rgba(C.ink, .3); ctx.fillRect(140 + i * 76 + 32, 824, 12 * q, 4); } } }
  },
  cues: d => [[0, 'bell'], ...[0, 1, 2, 3, 4].map(i => [(2.5 + i * .5) * B, 'blip', [523, 587, 659, 784, 880][i], .045]), [0, 'pad', [174.61, 220, 261.63, 329.63], d + .3, .07], [0, 'bass', 87.31, .08, 'triangle'], [2 * B, 'bass', 87.31, .07, 'triangle'], [4 * B, 'bass', 82.41, .07, 'triangle'], [0, 'whoosh', .35, .08], [B, 'stamp', .35], [1.5 * B, 'blip', 880, .05], [d - 1.1, 'riser', 1.1, .08]]
};

S.rinse = {
  draw(lt, d, t){
    // tip-out: dripper lifts, server tips its rinse water away, everything settles back
    const lift = -120 * (spring(lt - 4.5 * B, ...SPRING.default) - spring(lt - 6 * B, ...SPRING.default));
    const tilt = -.4 * (spring(lt - 4.75 * B, ...SPRING.default) - spring(lt - 5.75 * B, ...SPRING.default));
    const fill = .3 * eIO(inv(3 * B, 4.5 * B, lt)), drain = eIO(inv(5 * B, 5.75 * B, lt)), lvl = fill * (1 - drain);
    scaleBody(1, 0, 0);
    server(lvl, rgba(C.alt, .45), { tilt });
    if (lvl > .01 && tilt < -.2){ const [lx, ly] = lipAt(tilt); stream(lt, lx - 6, ly, BENCH - 4, 5 * B, 5.6 * B, rgba(C.alt, .7), 8); }
    // filter: a flat fan folds along its seam in the air, then drops into the dripper
    const drop = spring(lt - (1.5 * B - .12), ...SPRING.snappy), seated = drop > .6 ? 1 : 0;
    const water = lt > 3 * B && lt < 4.75 * B ? lerp(INNER.bot, 470, Math.sin(Math.PI * inv(3 * B, 4.75 * B, lt))) : null;
    dripper({ dy: lift, filter: seated, water, waterCol: rgba(C.alt, .35) });
    if (!seated){
      const fold = eIO(inv(.5 * B, 1.3 * B, lt)), oy = -230 * (1 - drop), top = 362 + oy, bot = INNER.bot + oy, hw = lerp(230, (INNER.wt + 12) / 2, fold);
      const a = inv(0, .2, lt);
      ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = PAPER; ctx.strokeStyle = rgba(C.ink, .25); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(CX - hw, top); ctx.quadraticCurveTo(CX, top - 30 * (1 - fold), CX + hw, top); ctx.lineTo(CX + INNER.wb / 2, bot); ctx.lineTo(CX - INNER.wb / 2, bot); ctx.closePath(); ctx.fill(); ctx.stroke();
      // the seam flap: sticks out to the right, then creases over (width goes + → −)
      const fw = 34 * Math.cos(Math.PI * fold); ctx.fillStyle = '#EFE7D8';
      ctx.beginPath(); ctx.moveTo(CX + hw, top); ctx.lineTo(CX + INNER.wb / 2, bot); ctx.lineTo(CX + INNER.wb / 2 + fw * .2, bot - 10); ctx.lineTo(CX + hw + fw, top + 6); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(CX + hw - 4, top + 6); ctx.lineTo(CX + INNER.wb / 2, bot - 6); ctx.stroke(); ctx.restore();
    }
    const k = pose(lt, [[0, KREST], [2.5 * B, KPOUR], [4.5 * B, KREST]]);
    stream(lt, KPOUR.x, KPOUR.y + 4, 540 + lift, 3 * B, 4.25 * B);
    kettle(k);
    this.copy(lt, d);
  },
  copy(lt){ stepBadge(1, lt); copyBlock(lt, TXT.rH, TXT.rS); },
  cues: d => [[.5 * B, 'tick', .04], [1.5 * B, 'stamp', .35], [3 * B, 'whoosh', 1.2, .07], [4.5 * B, 'blip', 520, .04], [5 * B, 'down', .12], [6 * B, 'tick', .03]]
};

S.dose = {
  draw(lt, d, t){
    const pourOn = B, pourOff = 3.5 * B, amt = eIO(inv(pourOn, pourOff, lt));
    const shakeP = inv(4.5 * B, 6 * B, lt), sx = Math.sin(shakeP * TAU * 3) * 10 * (1 - shakeP) * (shakeP > 0 && shakeP < 1 ? 1 : 0);
    const mound = 30 * Math.min(1, amt * 1.4) * (1 - eO(shakeP));
    const tare = lt >= 6.5 * B, fl = inv(6.5 * B - .06, 6.5 * B + .06, lt), sq = fl > 0 && fl < 1 ? Math.abs(1 - 2 * fl) : 1;
    const g = tare ? 0 : 22 * amt, land = inv(pourOff, pourOff + .6, lt);
    // slow creep in on the bar (the copy column is not zoomed)
    const z = 1 + .035 * Math.sin(Math.PI * clamp(lt / d));   // creeps in and back out, so the cut into bloom doesn't jump
    ctx.save(); ctx.translate(CX, 700); ctx.scale(z, z); ctx.translate(-CX, -700);
    scaleBody(1, g, 0, { flash: land > 0 && land < 1 ? (1 - land) : 0, squash: sq });
    kettle(KREST);
    ctx.save(); ctx.translate(sx, 0); server(0, COF); dripper({ filter: 1, bed: amt, mound }); ctx.restore();
    // dosing cup comes in, tips, pours a stream of grounds, leaves
    const cp = pose(lt, [[0, { x: CX + 300, y: -140, r: 0 }], [0, { x: CX + 10, y: 262, r: 0 }], [.5 * B, { x: CX + 10, y: 262, r: -1.2 }], [3.5 * B, { x: CX + 10, y: 262, r: -.2 }], [4 * B, { x: CX + 320, y: -160, r: 0 }]]);
    if (lt < pourOff + 1.6 * B){ const top = bedTop(amt) - mound, head = Math.min(top, 262 + (lt - pourOn) * 1400), tail = lt > pourOff ? 262 + (lt - pourOff) * 1400 : 262;
      if (lt > pourOn) for (const gr of GRAINS){ const y = lerp(262, top, (gr.o + lt * 1.9) % 1); if (y > head || y < tail) continue; dot(CX + gr.x * (y - 262) / 200 + 4, y, gr.r, GRDW, .9); }
      ctx.save(); ctx.translate(cp.x, cp.y); ctx.rotate(cp.r); ctx.translate(46, 36);
      ctx.fillStyle = C.panel; ctx.strokeStyle = rgba(C.ink, .35); ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(-46, -36, 92, 76, 14); ctx.fill(); ctx.stroke();
      ctx.fillStyle = rgba(C.acc, .85); ctx.fillRect(-46, 4, 92, 12); ctx.restore(); }
    ctx.restore();
    // "zero the scale" tag under the scale after the tare
    const tp = spring(lt - 6.5 * B, ...SPRING.snappy);
    benchTag(TXT.tare, tp * 2 * exitA(lt, d), (1 - tp) * 20);
    this.copy(lt, d);
  },
  copy(lt){ stepBadge(2, lt); copyBlock(lt, TXT.dH, TXT.dS); },
  cues: d => [[B, 'roll', 2.5 * B, 16], [3.5 * B, 'stamp', .45], [4 * B, 'whoosh', .2, .04], [4.5 * B, 'tick', .05], [5 * B, 'tick', .05], [5.5 * B, 'tick', .05], [6.5 * B, 'blip', 990, .06], [d - 1.1, 'riser', 1.1, .06]]
};

S.bloom = {
  draw(lt, d, t){
    const on = B, off = 2.5 * B, wet = inv(on + .3, off, lt), g = 50 * inv(on, off, lt), tm = clock(t);
    const dome = 30 * spring(lt - off - .2, 60, 15) + 8 * inv(off, d, lt);
    const bubbles = BUBBLES.map(b => { const ta = off + .4 + b.t * 4 * B, p = inv(ta, ta + .5, lt); return [b.x, 1.6 * b.r * Math.sin(Math.PI * p), p > 0 && p < 1 ? 1 : 0]; }).filter(b => b[2] > 0);
    const z = 1 + .4 * spring(lt - off, ...SPRING.heavy);
    benchTag(TXT.sped, spring(lt - on, ...SPRING.snappy) * 2);
    ctx.save(); cam(z, ZF);
    scaleBody(1, g, tm);
    server(.04 * inv(off, d, lt), COF);
    const water = lt > on && lt < off + 1.2 ? lerp(bedTop(1) + 4, bedTop(1) - 14, Math.sin(Math.PI * inv(on, off + 1.2, lt))) : null;
    dripper({ filter: 1, bed: 1, wet, dome, bubbles, water, waterCol: rgba('#7A4A2C', .45) });
    const k = pose(lt, [[0, KREST], [0, KPOUR], [off, KHOVER]]);
    stream(lt, KPOUR.x, KPOUR.y + 4, bedTop(1) - 6, on, off);
    kettle(k);
    ctx.restore();
    tempPill(spring(lt - .5 * B, ...SPRING.snappy) * (1 - inv(2.75 * B, 3 * B, lt)));
    // 30-second ring (sped up), between the copy and the bar
    const rp = spring(lt - .8 * B, ...SPRING.snappy) * exitA(lt, d);
    if (rp > 0){ const cx = 1010, cy = 520, r = 78;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(rp, rp);
      dot(0, 0, r + 22, C.panel); ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      const f = clamp(tm / 30); if (f > 0){ ctx.strokeStyle = f >= 1 ? C.acc : C.alt; ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke(); }
      T(mmss(Math.min(tm, 30)), 0, 16, { f: FK, w: 900, z: 46, c: C.ink, al: 'center' });
      ctx.restore();
      }
    this.copy(lt, d);
  },
  copy(lt){ stepBadge(3, lt); copyBlock(lt, TXT.bH, TXT.bS); },
  cues: d => [[.5 * B, 'blip', 700, .04], [B, 'whoosh', 1.4, .07], [2.5 * B, 'down', .05], ...[3, 4, 5, 6].map(i => [i * B, 'tick', .035]), ...[3.5, 4.5, 5.5, 6.5].map(i => [i * B, 'tick', .025]), [7 * B, 'bell']]
};

S.pour = {
  draw(lt, d, t){
    const on = .5 * B, off = 6 * B, tm = clock(t);
    const G = [[0, 50], [.5 * B, 50], [1.5 * B, 100], [3 * B, 200], [4.5 * B, 300], [6 * B, 400]];
    let g = 400; for (let i = 1; i < G.length; i++) if (lt < G[i][0]){ g = lerp(G[i - 1][1], G[i][1], inv(G[i - 1][0], G[i][0], lt)); break; }
    const top = bedTop(1) - 20, lvl = lerp(top, 440, spring(lt - on, ...SPRING.heavy)) + (lt > off ? (top - 440) * eIO(inv(off, d + 2.5 * B, lt)) : 0);
    benchTag(TXT.sped, 1);
    ctx.save(); cam(lerp(1.4, 1, spring(lt, ...SPRING.heavy)), ZF);
    scaleBody(1, g, tm);
    server(lerp(.04, .6, inv(.8 * B, d, lt)), COF);
    dripper({ filter: 1, bed: 1, wet: 1, dome: lerp(38, 22, spring(lt - on, ...SPRING.heavy)), water: lvl, waterCol: rgba('#7A4A2C', .5) });
    // the kettle circles gently while it pours, then goes home
    const sw = Math.sin(inv(on, off, lt) * TAU * 3.2) * 12 * (lt > on && lt < off ? 1 : 0);
    const k = pose(lt, [[0, KHOVER], [0, KPOUR], [off, KHOVER], [7 * B, KREST]]); k.x += sw;
    stream(lt, KPOUR.x + sw, KPOUR.y + 4, lvl, on, off);
    kettle(k);
    ctx.restore();
    tempPill(spring(lt - .5 * B, ...SPRING.snappy) * (1 - inv(6 * B, 6.3 * B, lt)));
    // top-down inset: the spiral from the centre, never out to the paper
    const ip = spring(lt - .25 * B, ...SPRING.default) * exitA(lt, d);
    if (ip > 0){ const cx = 1005, cy = 425, r = 150;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(ip, ip);
      dot(0, 0, r + 10, C.acc); dot(0, 0, r - 6, PAPER); dot(0, 0, r * .74, GRDW);
      ctx.save(); ctx.setLineDash([10, 9]); ctx.strokeStyle = rgba(C.acc, .7); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r * .87, 0, TAU); ctx.stroke(); ctx.restore();
      const sp = eIO(inv(.5 * B, 6 * B, lt)); ctx.strokeStyle = C.alt; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const e = polyPartial(SPIRAL.map(([x, y]) => [x * r, y * r]), sp);
      if (sp > 0 && sp < 1){ dot(e[0], e[1], 13, C.panel); dot(e[0], e[1], 8, C.alt); }
      ctx.restore();
      // "not here": a cross on the paper ring
      const xp = spring(lt - 2 * B, ...SPRING.snappy) * exitA(lt, d);
      if (xp > 0){ const a = -Math.PI * .75, px = cx + Math.cos(a) * r * .87, py = cy + Math.sin(a) * r * .87, s = 16 * xp;
        dot(px, py, 22 * xp, C.panel); ctx.strokeStyle = C.acc; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(px - s * .6, py - s * .6); ctx.lineTo(px + s * .6, py + s * .6); ctx.moveTo(px + s * .6, py - s * .6); ctx.lineTo(px - s * .6, py + s * .6); ctx.stroke();
        T(TXT.no, px - 30, py - 20, { f: FH, w: WT(900), z: 36, c: C.acc, a: clamp(xp), al: 'right' }); }
      T(TXT.top, cx, cy + r + 54, { f: FH, w: WT(800), z: 30, c: C.dim, al: 'center', ls: KO ? 0 : 2, a: inv(.6 * B, 1 * B, lt) * exitA(lt, d) }); }
    this.copy(lt, d);
  },
  copy(lt){ stepBadge(4, lt); copyBlock(lt, TXT.pH, TXT.pS, { fit: 700 }); },
  cues: d => [[.5 * B, 'blip', 700, .04], [.5 * B, 'scan', 5.5 * B, .05], ...[1.5, 3, 4.5, 6].map((b, i) => [b * B, 'blip', [660, 784, 988, 1175][i], .06]), [2 * B, 'tick', .05], [6 * B, 'correct', .1], [7 * B, 'blip', 520, .03]]
};

// drips land further and further apart; each drop lands on its quarter-beat grid time
const DRIPS = [1, 1.5, 2.25, 3.25];
S.done = {
  draw(lt, d, t){
    const tm = clock(t), lift = spring(lt - 3.5 * B, ...SPRING.heavy), da = 1 - inv(3.75 * B, 5 * B, lt);
    const top = bedTop(1) - 20, lvl = lerp(440 + (top - 440) * eIO(inv(6 * B, sT('done') - sT('pour') + 2.5 * B, sT('done') - sT('pour'))), top, eIO(inv(0, 2.2 * B, lt)));
    scaleBody(1, 400, tm, { flash: lt > 3 * B ? (1 - inv(3 * B, 3.8 * B, lt)) : 0 });
    const sl = lerp(.6, .8, eO(inv(0, 3.4 * B, lt)));
    server(sl, COF);
    // drips from the tip, further and further apart, until the dripper lifts
    const surf = lerp(SRV.bot, SRV.top + 34, sl);
    DRIPS.forEach(b => { const t0 = b * B, p = inv(t0 - .2, t0, lt); if (p <= 0 || p >= 1 || lt > 3.5 * B) return; dot(CX, lerp(606, surf, p * p), 6, COF); });
    dripper({ dy: -330 * lift, a: da, filter: 1, bed: 1, wet: 1, dome: 22 * (1 - inv(0, 2.4 * B, lt) * .6), water: lvl, waterCol: rgba('#7A4A2C', .5) });
    if (lt < 2.2 * B) stream(lt, CX, 604, surf, -1, 2.2 * B, COF, 6);
    kettle(KREST); steam(CX, SRV.top - 12, lt, inv(4 * B, 5 * B, lt), 120);
    benchTag(TXT.sped, exitA(lt, d));
    this.copy(lt, d);
  },
  copy(lt){
    stepBadge(5, lt); copyBlock(lt, TXT.fH, TXT.fS);
    // 0:00–3:00 timeline under the copy, with the 2:30–3:00 window
    const tm = clock(sT('done') + lt), bx = 110, bw = 680, by = 780, gp = spring(lt - .3 * B, ...SPRING.default), X = s => bx + bw * s / 180;
    if (gp > 0){ ctx.save(); ctx.globalAlpha *= clamp(gp * 1.5);
      ctx.fillStyle = C.grid; ctx.beginPath(); ctx.roundRect(bx, by, bw * gp, 22, 11); ctx.fill();
      ctx.fillStyle = rgba(C.bad, .45); ctx.beginPath(); ctx.roundRect(X(150), by, (X(180) - X(150)) * inv(.4, 1, gp), 22, 11); ctx.fill();
      ctx.fillStyle = C.alt; ctx.beginPath(); ctx.roundRect(bx, by, Math.max(22, X(tm) - bx) * gp, 22, 11); ctx.fill();
      const stop = lt >= 3 * B, mp = stop ? eBack(inv(3 * B, 3 * B + .25, lt)) : 1; dot(X(tm), by + 11, 16 * mp + (stop ? 0 : 0), stop ? C.acc : C.alt); dot(X(tm), by + 11, 7, C.panel);
      ['0:00', '1:00', '2:00', '3:00'].forEach((s, i) => T(s, X(i * 60), by + 66, { f: FK, w: 800, z: 30, c: C.dim, al: i === 0 ? 'left' : i === 3 ? 'right' : 'center' }));
      T(TXT.zone, X(180) + 14, by - 24, { f: FK, w: 900, z: 52, c: '#9A6512', al: 'right', a: inv(.6 * B, 1 * B, lt) });
      ctx.restore(); }
  },
  cues: d => [...DRIPS.map((b, i) => [b * B, 'blip', 1320, .03 - i * .003]), [3 * B, 'stamp', .45], [3.5 * B, 'whoosh', .45, .08], [d - 1.1, 'riser', 1.1, .06]]
};

S.close = {
  draw(lt, d, t){
    // mug on the counter; the server pours into it, then the bar slides away and the recipe card slides in
    const mp = spring(lt - .75 * B, ...SPRING.heavy), mx = 560, ms = 1.55;
    const S0 = { x: 0, y: 0, r: 0 }, SP = { x: 640 - (CX - 112), y: -8, r: -1.05 };

    tick: (e, a = .03) => osc(e, 'square', 3400, a, .012),                              // clock / counter tick
    hit: (e, a = .6) => { nz(e, 'bandpass', 2600, 1.2, a * .3, .08); osc(e, 'square', 180, a * .15, .09); },
    slam: (e, a = .7) => { osc(e, 'sine', 125, a, .42, 38, .18); nz(e, 'bandpass', 1100, 1, a * .45, .1); osc(e, 'square', 1600, a * .06, .015); },   // headline hit
    impact: (e, a = .95) => { osc(e, 'sine', 95, a, .95, 30, .55); nz(e, 'lowpass', 3200, .7, a * .45, .6, 180); [220, 261.63, 329.63, 440].forEach(f => osc(e, 'sawtooth', f, .045, .4, 0, 0, 2200)); },   // thesis / finale

    stamp: (e, a = .7) => { osc(e, 'sine', 105, a, .28, 36, .15); nz(e, 'bandpass', 900, 1, a * .5, .08); osc(e, 'square', 1500, a * .07, .012); },   // badge / chip pop

    riser: (e, len, a = .2) => swell(e, len, a, 300, 8000),                              // end of a scene, into the cut

    down: (e, a = .22) => osc(e, 'sine', 720, a, .5, 70, .45),                           // power-down / loss
    error: (e, a = .11) => { osc(e, 'square', 110, a, .3, 0, 0, 900); osc(e, 'square', 117, a, .3, 0, 0, 900); },
    correct: (e, a = .13) => { osc(e, 'sine', 880, a, .25); osc(e + .09, 'sine', 1318.5, a, .45); },

      if (!lite && six === 0) SYN.bass(e + .01, ROOT[bar] * 2, .09, 'triangle');
    }
    if (GROOVE !== 'electro' && six === 0 && beat % 4 === 0) SYN.pad(e, CH[bar].map(f => f / 2), 4 * B + .2, lite ? .016 : .024);

}

fsb.hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
fsb.addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
startBtn.addEventListener('click', e => { e.stopPropagation(); if (!armed || head >= DUR - .8) arm(0); else play(); });
stage.addEventListener('click', () => { if (armed) toggle(); });
stage.addEventListener('dblclick', toggleFs);
/* progress bar: click to jump, drag to scrub; audio re-syncs on release */
const fracAt = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width); };
scrub.addEventListener('pointermove', e => { hoverFrac = fracAt(e); if (scrubbing) head = hoverFrac * DUR; dirty = true; });
scrub.addEventListener('pointerleave', () => { if (!scrubbing){ hoverFrac = null; dirty = true; } });
scrub.addEventListener('pointerdown', e => { e.stopPropagation(); scrubbing = true; try { scrub.setPointerCapture(e.pointerId); } catch (_){}
  if (playing) stopAudio(); hoverFrac = fracAt(e); head = hoverFrac * DUR; dirty = true; });
scrub.addEventListener('pointerup', e => { if (!scrubbing) return; scrubbing = false; head = fracAt(e) * DUR;
  if (e.pointerType !== 'mouse') hoverFrac = null;
  // before the first play or after the end, a click starts playback from that point; while paused it only moves the playhead
  if (!armed || !startBtn.hidden) arm(Math.min(head, DUR - .1)); else if (playing) schedule(head); syncUI(); });
scrub.addEventListener('pointercancel', () => { scrubbing = false; hoverFrac = null; if (playing) schedule(head); });
scrub.addEventListener('click', e => e.stopPropagation());
scrub.addEventListener('dblclick', e => e.stopPropagation());
document.addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') seek(head + 2);
  else if (e.key === 'ArrowLeft') seek(head - 2);
  else if (e.key === 'm' || e.key === 'M'){ soundOn = !soundOn; if (bus) bus.gain.value = soundOn ? 1 : 0; }
  else if (e.key === 'f' || e.key === 'F') toggleFs();
});

/* ================================================================ BOOT
   Canvas text measures wrong until the web fonts are in, so anything that measures text once (cached layouts,
   dot-matrix word maps) must be built after fontsReady(). */
const ALL = JSON.stringify(TXT) + '0123456789.,×/−%←→↺';
async function fontsReady(){
  if (!document.fonts || !document.fonts.load) return;
  const jobs = [['900', FK], ['700', FK], ['500', FK], ['900', FD], ['700', FM], ['400', FM]].map(([w, f]) => document.fonts.load(`${w} 64px ${f}`, ALL));
  await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 4500))]).catch(() => {});
}
fontsReady().then(() => {
  // @@ready
  // build font-dependent caches here (e.g. buildDots())
  // @@/ready
  const POSTER = watched ? DUR - .7 : CFG.posterT;
  if (still != null){ head = still; startBtn.hidden = true; } else head = POSTER;
  dirty = true; requestAnimationFrame(frame);
  document.body.dataset.ready = '1';
});
window.__motion = { render, DUR, SC, B, W, H, LANG, LANGS, groove: CFG.music.groove || 'electro' };
if (new URLSearchParams(location.search).has('audiotest')) (async () => {
  try { const oc = new OfflineAudioContext(2, Math.ceil(22050 * DUR), 22050), g = oc.createGain(); g.connect(masterChain(oc, oc.destination)); buildSound(oc, g, 0, 0);
    const d = (await oc.startRendering()).getChannelData(0), per = SC.map(s => { let q = 0, n = 0; for (let i = Math.floor(s.t0 * 22050); i < Math.floor((s.t0 + s.d) * 22050) && i < d.length; i += 5){ q += d[i] * d[i]; n++; } return Math.sqrt(q / Math.max(1, n)).toFixed(3); });
    let pk = 0; for (let i = 0; i < d.length; i += 3) pk = Math.max(pk, Math.abs(d[i]));
    document.body.dataset.audio = `peak=${pk.toFixed(3)} rms/scene=${per.join(',')}`;
  } catch (e){ document.body.dataset.audio = 'ERR ' + e.message; } })();
})();
</script>
